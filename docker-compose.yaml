version: "3.9"

services:

  frontend:
    build: ./audio-room-client
    expose:
      - "80"

  websocket:
    build: ./ws
    container_name: websocket
    environment:
      WS_PORT: 3000
    expose:
      - "3000"
    restart: unless-stopped 

  janus:
    build:
      context: ./janus
      dockerfile: Dockerfile
      args:
        JANUS_VERSION: v1.3.1

    image: janus-gateway:local
    container_name: janus

    ports:
      - "8088:8088" 
      - "8089:8089"
      - "8188:8188"
      - "8189:8189"
      - "10000-10200:10000-10200/udp"
      - "7088:7088"
      - "7089:7089"

    restart: unless-stopped
    # Optional: mount your own janus.cfg if you have one
    volumes:
      - ./janus/janus.jcfg:/opt/janus/etc/janus/janus.jcfg
      - ./janus/janus.transport.http.jcfg:/opt/janus/etc/janus/janus.transport.http.jcfg

  coturn:
    build: ./coturn
    environment:
      #- TURN_USERDB=/etc/turnserver/turnuserdb.txt
      - TURN_USER=demo
      - TURN_PASS=demo
    volumes:
      - ./turn/turnserver.conf:/etc/turnserver/turnserver.conf:ro
      #- ./turn/turnuserdb.txt:/etc/turnserver/turnuserdb.txt:ro
      - ./certs:/etc/letsencrypt/live/your.domain:ro
    expose:
      - "3478/udp"
      - "3478/tcp"
      - "5349/tcp"
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
    # If you want coturn to listen on the host’s external IP only:
    # networks:
    #   default:
    #     ipv4_address: YOUR_VPS_IP

  proxy:
    image: nginx:stable-alpine
    ports:
      - 443:443
      - 80:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - websocket
      - janus
      - coturn
