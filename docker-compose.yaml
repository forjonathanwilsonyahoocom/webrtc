# docker-compose.yml (root of your project)
version: "3.9"

services:
  websocket:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install --omit=dev && node index.js"
    volumes:
      - ./ws:/app
    environment:
      - WS_PORT=3000
    expose:
      - "3000"
  
  janus:
    build:
      context: ./janus
      dockerfile: Dockerfile
      args:
        JANUS_VERSION: v1.3.1

    image: janus-gateway:local
    container_name: janus

    ports:
      - "8088:8088"                 # Janus HTTP transport
      - "8089:8089"                 # Janus HTTPS transport, if enabled
      - "8188:8188"                 # Janus Admin HTTP transport
      - "8189:8189"                 # Janus Admin WebSocket transport
      - "10000-10200:10000-10200/udp" # RTP/RTCP media range

    restart: unless-stopped
    # Optional: mount your own janus.cfg if you have one
    # volumes:
    #   - ./janus.cfg:/usr/local/etc/janus/janus.cfg



  coturn:
    build: ./coturn          # builds from the Dockerfile above
    environment:
      # If you want to use a separate user DB
      # - TURN_USERDB=/etc/turnserver/turnuserdb.txt
      - TURN_USER=demo
      - TURN_PASS=demo
    volumes:
      # Mount your TLS certs and config override
      - ./turn/turnserver.conf:/etc/turnserver/turnserver.conf:ro
      - ./turn/turnuserdb.txt:/etc/turnserver/turnuserdb.txt:ro
      - ./certs:/etc/letsencrypt/live/your.domain:ro
    expose:
      - "3478/udp"
      - "3478/tcp"
      - "5349/tcp"
    # If you want coturn to listen on the host’s external IP only:
    # networks:
    #   default:
    #     ipv4_address: YOUR_VPS_IP

  proxy:
    image: nginx:stable-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - websocket
      - janus
      - coturn
