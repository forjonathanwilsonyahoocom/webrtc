services:

  janus:
    build:
      context: ./janus
      dockerfile: Dockerfile
      args:
        JANUS_VERSION: v1.3.1

    image: janus-gateway:local
    container_name: janus

    #ports:
    # - "8088:8088" 
    # - "8089:8089"
    # - "8188:8188"
    # - "8189:8189"
    # - "10000-10050:10000-10050/udp"
    # - "7088:7088"
    # - "7089:7089"

    restart: unless-stopped
    # Optional: mount your own janus.cfg if you have one
    volumes:
      - ${LETSENCRYPT_PATH}:/etc/letsencrypt:ro
      - ./janus/janus.jcfg:/opt/janus/etc/janus/janus.jcfg
      - ./janus/janus.transport.http.jcfg:/opt/janus/etc/janus/janus.transport.http.jcfg
    mem_limit: 128m
    ulimits:
      nofile: 8192
    depends_on:
      - coturn

  coturn:
    build: ./coturn  
    environment:
      - TURN_USERDB=/etc/turnserver/turnuserdb.txt
      #- TURN_USER=demo
      #- TURN_PASS=demo
    volumes:
      - ./turn/turnserver.conf:/etc/turnserver/turnserver.conf:ro
      - ./turn/turnuserdb.txt:/etc/turnserver/turnuserdb.txt:ro
      - ${LETSENCRYPT_PATH}:/etc/letsencrypt:ro 
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "10000-10050:10000-10050/udp"
    mem_limit: 128m
    ulimits:
      nofile: 4096

  proxy-and-client:
    build: ./audio-room-client
    image: proxy-and-client:latest
    ports:
      - 443:443
      - 80:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${LETSENCRYPT_PATH}:/etc/nginx/certs:ro
    mem_limit: 128m
    ulimits:
      nofile: 4096
    depends_on:
      - janus
      - coturn
