events {
    worker_connections 1024;
}

http {
    upstream websocket_backend {
        server websocket:3000;
    }

    upstream janus_http_admin {
        server janus:7088;
    }

    upstream janus_http_backend {
        server janus:8088;
    }

    # Redirect all plain HTTP traffic to HTTPS
    server {
        listen 80;
        listen [::]:80;

        server_name your.domain.example;


        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name your.domain.example;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;

        # Basic HTTPS test endpoint
        location / {
            proxy_pass http://frontend:80;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # Node WebSocket server
        location /ws {
            proxy_pass http://websocket_backend;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Janus HTTP transport
        location /janus {
            proxy_pass http://janus_http_backend;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /admin {
            proxy_pass http://janus:7088;

            # Forward the Authorization header – you’ll still need to add it in
            # your client requests.
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;

            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}

