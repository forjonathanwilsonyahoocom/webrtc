[admin]
    # Whether the admin interface is enabled (default: false)
    enabled = true

    # TCP/UDP port that the admin interface listens on.
    # You can keep the defaults (7088 for HTTP, 7089 for HTTPS) or
    # change them if you prefer.
    port = 7088
    https_port = 7089

    # Secret key that you will use when calling the admin API.
    # Replace "secret" with something random and keep it secret.
    # You can also use "admin_pass" instead of "admin_key".
    key = secret

    # Optionally bind only to the loopback interface.  If you expose
    # the admin port to the public internet, you should not set this
    # or you should bind to a dedicated IP.
    # bind = 0.0.0.0


